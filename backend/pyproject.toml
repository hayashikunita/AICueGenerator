[project]
name = "aicuegenerator-backend"
version = "0.1.0"
description = "rekordbox AI Cue Generator - backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

# 解析(librosa/numpy/scipy)依存は P1 着手時に追加する。
# 解析(librosa/numpy/scipy)依存は P1 着手時に追加する。
[project.optional-dependencies]
rekordbox = [
    "pyrekordbox>=0.4",
    "psutil>=5.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "psutil>=5.9",
    "numpy>=1.26",
]

# 音源デコード/ビート推定の重い依存。実解析時のみ導入する。
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "audioread>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
